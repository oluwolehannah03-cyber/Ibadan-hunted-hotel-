<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ibadan Haunted Hotel</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #eeeeee;
    }
  </style>
</head>

<body>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfd8e8);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0, 2, 8);


// RENDERER
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);


// BRIGHT HOTEL LIGHTING
const ambient = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambient);

const light = new THREE.PointLight(0xfff2c4, 35, 25);
light.position.set(0, 4, 2);
scene.add(light);


// FLOOR
const floor = new THREE.Mesh(
  new THREE.BoxGeometry(12, 0.2, 12),
  new THREE.MeshStandardMaterial({ color: 0xd8c3a5 })
);

floor.position.y = -0.1;
scene.add(floor);


// CARPET
const carpet = new THREE.Mesh(
  new THREE.BoxGeometry(6, 0.04, 7),
  new THREE.MeshStandardMaterial({ color: 0x8b3f3f })
);

carpet.position.set(0, 0.03, 1);
scene.add(carpet);


// BACK WALL
const backWall = new THREE.Mesh(
  new THREE.BoxGeometry(12, 4, 0.2),
  new THREE.MeshStandardMaterial({ color: 0xf0e6d2 })
);

backWall.position.set(0, 2, -6);
scene.add(backWall);


// LEFT WALL
const leftWall = new THREE.Mesh(
  new THREE.BoxGeometry(0.2, 4, 12),
  new THREE.MeshStandardMaterial({ color: 0xe7dcc8 })
);

leftWall.position.set(-6, 2, 0);
scene.add(leftWall);


// RIGHT WALL
const rightWall = new THREE.Mesh(
  new THREE.BoxGeometry(0.2, 4, 12),
  new THREE.MeshStandardMaterial({ color: 0xe7dcc8 })
);

rightWall.position.set(6, 2, 0);
scene.add(rightWall);


// RECEPTION DESK
const desk = new THREE.Mesh(
  new THREE.BoxGeometry(4, 1.2, 1.2),
  new THREE.MeshStandardMaterial({ color: 0x6b4226 })
);

desk.position.set(0, 0.6, -3);
scene.add(desk);


// RECEPTION TOP
const deskTop = new THREE.Mesh(
  new THREE.BoxGeometry(4.2, 0.15, 1.4),
  new THREE.MeshStandardMaterial({ color: 0x9b6b43 })
);

deskTop.position.set(0, 1.25, -3);
scene.add(deskTop);


// RECEPTION BELL
const bell = new THREE.Mesh(
  new THREE.SphereGeometry(0.18, 16, 16),
  new THREE.MeshStandardMaterial({
    color: 0xffd700,
    metalness: 0.7,
    roughness: 0.2
  })
);

bell.position.set(0, 1.48, -3);
scene.add(bell);


// DOOR 1
const door1 = new THREE.Mesh(
  new THREE.BoxGeometry(1.5, 2.8, 0.2),
  new THREE.MeshStandardMaterial({ color: 0x6b4226 })
);

door1.position.set(-3.5, 1.4, -5.85);
scene.add(door1);


// DOOR 2
const door2 = new THREE.Mesh(
  new THREE.BoxGeometry(1.5, 2.8, 0.2),
  new THREE.MeshStandardMaterial({ color: 0x6b4226 })
);

door2.position.set(3.5, 1.4, -5.85);
scene.add(door2);


// HOTEL SIGN
const sign = new THREE.Mesh(
  new THREE.BoxGeometry(5, 1, 0.15),
  new THREE.MeshStandardMaterial({ color: 0x8b6f47 })
);

sign.position.set(0, 3.1, -5.8);
scene.add(sign);


// CEILING LIGHT
const ceilingLight = new THREE.Mesh(
  new THREE.SphereGeometry(0.35, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xffffcc })
);

ceilingLight.position.set(0, 3.8, 1);
scene.add(ceilingLight);


// ANIMATION
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

animate();


// RESIZE
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
