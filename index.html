
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ibadan Haunted Hotel</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; overflow: hidden;
  background: #18130e; touch-action: none;
  font-family: Arial, sans-serif;
}
canvas { display:block; }
#title {
  position:fixed; top:10px; left:10px; z-index:5;
  color:#ffd783; background:#20170de8;
  border:1px solid #b9914d; border-radius:10px;
  padding:10px 14px; font-weight:bold;
}
#hint {
  position:fixed; top:12px; right:10px; z-index:5;
  color:white; background:#20170de8;
  padding:10px; border-radius:8px; font-size:12px;
}
#stick {
  position:fixed; bottom:15px; left:15px;
  width:145px; height:145px; z-index:8;
  border-radius:50%; border:3px solid #aaa;
  background:#252a2dbb; display:grid;
  grid-template:1fr 1fr 1fr / 1fr 1fr 1fr;
  place-items:center; touch-action:none;
}
.key {
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#62666bd9;color:white;font-size:24px;
}
#up {grid-area:1/2}
#left {grid-area:2/1}
#right {grid-area:2/3}
#down {grid-area:3/2}
#dot {grid-area:2/2;width:25px;height:25px;
  border-radius:50%;background:#d4b16c}
#bag {
  position:fixed;right:15px;bottom:20px;z-index:8;
  color:white;background:#28231be0;border:1px solid #b9914d;
  border-radius:12px;padding:13px;font-size:14px;
}
#message {
  position:fixed;left:50%;top:24%;transform:translateX(-50%);
  background:#17130fe8;color:#ffe3a4;padding:12px;
  border-radius:8px;text-align:center;display:none;z-index:10;
}
</style>
</head>
<body>
<div id="title">♛ CRYSTAL LUXURY HOTEL</div>
<div id="hint">IBADAN<br>Explore the lobby</div>
<div id="stick">
  <div class="key" id="up">▲</div>
  <div class="key" id="left">◀</div>
  <div id="dot"></div>
  <div class="key" id="right">▶</div>
  <div class="key" id="down">▼</div>
</div>
<div id="bag">🎒 Inventory: 0 items</div>
<div id="message"></div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8c9aa7);
scene.fog = new THREE.Fog(0x8c9aa7, 23, 45);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth / innerHeight, 0.1, 100
);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffe9c4,0x665544,2.1));
const light = new THREE.PointLight(0xffd99a,100,35);
light.position.set(0,5,1);
scene.add(light);

function material(color, roughness=0.7, metalness=0) {
 return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
function block(w,h,d,color,x,y,z, mat=null) {
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
   mat || material(color));
 m.position.set(x,y,z); scene.add(m); return m;
}
function sphere(r,color,x,y,z) {
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),
   material(color));
 m.position.set(x,y,z);scene.add(m);return m;
}
function cylinder(rt,rb,h,color,x,y,z) {
 const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,16),
   material(color));
 m.position.set(x,y,z);scene.add(m);return m;
}

// HOTEL FLOOR AND WALLS
block(18,.3,22,0xcbb99c,0,-.2,0);
block(18,5,.3,0xe6d5b9,0,2.4,-10);
block(.3,5,22,0xd6c5ab,-9,2,0);
block(.3,5,22,0xd6c5ab,9,2,0);

for(let x=-8;x<=8;x+=2){
 block(.02,.01,20,0x8c7963,x,.0,0);
}
for(let z=-9;z<=9;z+=2){
 block(18,.015,.025,0x8c7963,0,.01,z);
}
block(7,.04,10,0x792e2c,0,.0,2);

// Reception desk
block(5,1.3,1.2,0x55301d,0,.65,-5);
block(5.2,.15,1.4,0x292522,0,1.35,-5);
block(4,.65,.05,0xb88a43,0,.65,-4.37);

// Laptop on desk
block(.8,.06,.55,0x25282b,-1,1.48,-5);
block(.8,.5,.04,0x171b20,-1,1.75,-5.23);
block(.68,.38,.02,0x557e88,-1,1.75,-5.20);

// Hotel files
for(let i=0;i<3;i++){
 block(.65,.07,.48,[0x252e48,0x7a3328,0x354c39][i],
       .2+i*.12,1.48+i*.08,-5.05);
}
block(.45,.04,.35,0xe9dfca,1.1,1.48,-5);
block(.4,.03,.3,0xe9dfca,1.1,1.52,-5);

// Numbered room keys
for(let i=0;i<4;i++){
 const x=1.6+i*.25;
 cylinder(.035,.035,.12,0xd7ac43,x,1.5,-5);
 block(.09,.12,.025,0xe3b94f,x,1.4,-5);
 block(.06,.02,.03,0x5b4221,x,1.4,-4.98);
}

// Reception bell
sphere(.12,0xe6b942,-1.8,1.52,-5);

// Doors, frames and room labels
function makeDoor(x,number) {
 block(1.6,3,.18,0x402417,x,1.5,-9.75);
 block(1.35,2.7,.08,0x704328,x,1.45,-9.62);
 sphere(.07,0xe5b744,x+.48,1.4,-9.5);
 block(1.5,.35,.12,0x292019,x,3.25,-9.5);
 // Room number plaque
 block(.6,.25,.08,0xb38a42,x,3.25,-9.38);
}
makeDoor(-5,"101");
makeDoor(5,"102");

// Hotel sign
block(5,.9,.2,0x241a13,0,3.8,-9.5);
block(4.7,.7,.05,0x644523,0,3.8,-9.35);

// Chandelier
cylinder(.09,.09,.6,0xd6a844,0,4.65,0);
cylinder(.75,.9,.12,0xc99c45,0,4.3,0);
cylinder(.58,.7,.1,0xe7c16a,0,4.18,0);
for(let i=0;i<10;i++){
 const a=i*Math.PI/5;
 const x=Math.cos(a)*.68,z=Math.sin(a)*.68;
 cylinder(.035,.035,.45,0xd7ad53,x,4.02,z);
 sphere(.12,0xffe3a0,x,3.8,z);
}
for(let i=0;i<6;i++){
 const a=i*Math.PI/3;
 sphere(.1,0xffe9b1,Math.cos(a)*.42,4.0,Math.sin(a)*.42);
}

// Plants
function plant(x,z){
 cylinder(.4,.48,.5,0x8a6947,x,.25,z);
 cylinder(.04,.04,.7,0x4b3928,x,.8,z);
 for(let i=0;i<7;i++){
  const a=i*2.4;
  const leaf=sphere(.15,0x267044,
    x+Math.cos(a)*.28,1.05+(i%3)*.16,z+Math.sin(a)*.28);
  leaf.scale.set(.7,1.8,.7);
 }
}
plant(-7,-6); plant(7,-6);

// Character: woman in a red blazer and black skirt
const player = new THREE.Group();
scene.add(player);

const skin=material(0x8c5238);
const red=material(0x8f292c);
const black=material(0x19191e);
const shoes=material(0x161419);
const hair=material(0x171111);

function part(parent,w,h,d,mat,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 m.position.set(x,y,z);parent.add(m);return m;
}
function ball(parent,r,mat,x,y,z,sx=1,sy=1,sz=1){
 const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat);
 m.position.set(x,y,z);m.scale.set(sx,sy,sz);parent.add(m);return m;
}

// Legs, skirt and shoes
part(player,.17,.65,.19,black,-.13,.55,0);
part(player,.17,.65,.19,black,.13,.55,0);
part(player,.19,.12,.3,shoes,-.13,.15,-.035);
part(player,.19,.12,.3,shoes,.13,.15,-.035);
part(player,.48,.48,.3,black,0,1.0,0);

// Body and blazer
part(player,.55,.65,.3,red,0,1.55,0);
part(player,.16,.6,.22,red,-.35,1.52,0);
part(player,.16,.6,.22,red,.35,1.52,0);

// Neck and head
part(player,.14,.18,.14,skin,0,1.97,0);
ball(player,.25,skin,0,2.2,0, .82,1.1,.85);
ball(player,.27,hair,0,2.36,.015, .9,.8,.9);
ball(player,.13,hair,0,2.18,.17,1,.8,.65);

// Arms
part(player,.14,.48,.16,skin,-.37,1.25,0);
part(player,.14,.48,.16,skin,.37,1.25,0);

// Simple front-facing features; camera follows from behind
ball(player,.035,black,-.07,2.23,.205);
ball(player,.035,black,.07,2.23,.205);

// Start the player facing the hotel desk
player.position.set(0,0,5.5);
player.rotation.y=0;

// Movement joystick
const moving={up:false,down:false,left:false,right:false};
for(const dir of Object.keys(moving)){
 const el=document.getElementById(dir);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();moving[dir]=true;
  el.setPointerCapture(e.pointerId);
 });
 function stop(){moving[dir]=false;}
 el.addEventListener("pointerup",stop);
 el.addEventListener("pointercancel",stop);
 el.addEventListener("lostpointercapture",stop);
}

// Landscape request (supported devices only)
async function landscape(){
 try {
  if(screen.orientation && screen.orientation.lock)
    await screen.orientation.lock("landscape");
 } catch(e) {}
}
document.body.addEventListener("pointerdown",landscape,{once:true});

// Camera follows behind the character
const offset=new THREE.Vector3(0,3.2,6);
const target=new THREE.Vector3();
function animate(){
 requestAnimationFrame(animate);
 const speed=.055;
 if(moving.up) player.position.z-=speed;
 if(moving.down) player.position.z+=speed;
 if(moving.left) player.position.x-=speed;
 if(moving.right) player.position.x+=speed;

 player.position.x=THREE.MathUtils.clamp(player.position.x,-8,8);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-8,9);

 target.set(player.position.x,player.position.y+1.1,player.position.z);
 const desired=player.position.clone().add(offset);
 camera.position.lerp(desired,.12);
 camera.lookAt(target);

 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

// Simple inventory feedback
document.getElementById("bag").addEventListener("click",()=>{
 const m=document.getElementById("message");
 m.textContent="Inventory: Empty. Explore the reception for clues.";
 m.style.display="block";
 setTimeout(()=>m.style.display="none",2500);
});
</script>
</body>
 </html>
