<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ibadan Haunted Hotel</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';


// =========================
// SCENE
// =========================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x111111);


// =========================
// CAMERA
// =========================

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 2, 7);


// =========================
// LIGHT
// =========================

const light = new THREE.AmbientLight(
  0xffffff,
  1
);

scene.add(light);


// =========================
// FLOOR
// =========================

const floorGeometry =
  new THREE.BoxGeometry(10, 0.2, 10);

const floorMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x555555
  });

const floor =
  new THREE.Mesh(
    floorGeometry,
    floorMaterial
  );

floor.position.y = -0.1;

scene.add(floor);


// =========================
// BACK WALL
// =========================

const wallGeometry =
  new THREE.BoxGeometry(10, 3, 0.2);

const wallMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x888888
  });

const backWall =
  new THREE.Mesh(
    wallGeometry,
    wallMaterial
  );

backWall.position.set(0, 1.5, -5);

scene.add(backWall);


// =========================
// LEFT WALL
// =========================

const sideGeometry =
  new THREE.BoxGeometry(0.2, 3, 10);

const leftWall =
  new THREE.Mesh(
    sideGeometry,
    wallMaterial
  );

leftWall.position.set(-5, 1.5, 0);

scene.add(leftWall);


// =========================
// RIGHT WALL
// =========================

const rightWall =
  new THREE.Mesh(
    sideGeometry,
    wallMaterial
  );

rightWall.position.set(5, 1.5, 0);

scene.add(rightWall);


// =========================
// CEILING
// =========================

const ceilingGeometry =
  new THREE.BoxGeometry(10, 0.2, 10);

const ceilingMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x333333
  });

const ceiling =
  new THREE.Mesh(
    ceilingGeometry,
    ceilingMaterial
  );

ceiling.position.y = 3;

scene.add(ceiling);


// =========================
// BED
// =========================

const bedGeometry =
  new THREE.BoxGeometry(3, 0.6, 5);

const bedMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x222244
  });

const bed =
  new THREE.Mesh(
    bedGeometry,
    bedMaterial
  );

bed.position.set(0, 0.4, -1);

scene.add(bed);


// =========================
// BED HEADBOARD
// =========================

const headGeometry =
  new THREE.BoxGeometry(3, 1.8, 0.3);

const headboard =
  new THREE.Mesh(
    headGeometry,
    bedMaterial
  );

headboard.position.set(0, 1.2, -3.3);

scene.add(headboard);


// =========================
// RUG
// =========================

const rugGeometry =
  new THREE.BoxGeometry(4, 0.05, 3);

const rugMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x552222
  });

const rug =
  new THREE.Mesh(
    rugGeometry,
    rugMaterial
  );

rug.position.set(0, 0.05, 2);

scene.add(rug);


// =========================
// LIGHT
// =========================

const bulb =
  new THREE.PointLight(
    0xffffcc,
    8,
    15
  );

bulb.position.set(0, 2.7, 0);

scene.add(bulb);


// =========================
// RENDERER
// =========================

const renderer =
  new THREE.WebGLRenderer({
    antialias: true
  });

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(
  renderer.domElement
);


// =========================
// RESIZE
// =========================

window.addEventListener(
  'resize',
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


// =========================
// GAME LOOP
// =========================

function animate() {

  requestAnimationFrame(
    animate
  );

  renderer.render(
    scene,
    camera
  );

}

animate();

</script>

</body>
    </html>
