<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ibadan Haunted Hotel</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  touch-action: none;
}
canvas {
  display: block;
}
#joystick {
  position: fixed;
  left: 22px;
  bottom: 22px;
  width: 180px;
  height: 180px;
  border: 3px solid #9ca3af;
  border-radius: 50%;
  background: rgba(30,35,42,0.82);
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
  place-items: center;
  z-index: 10;
  touch-action: none;
  user-select: none;
}
.key {
  color: white;
  font-size: 30px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #555e68;
  display: flex;
  justify-content: center;
  align-items: center;
}
#up { grid-column: 2; grid-row: 1; }
#left { grid-column: 1; grid-row: 2; }
#center {
  grid-column: 2;
  grid-row: 2;
  width: 38px;
  height: 38px;
  background: #3e4853;
  border-radius: 50%;
}
#right { grid-column: 3; grid-row: 2; }
#down { grid-column: 2; grid-row: 3; }
.key.active { background: #b38b52; }
</style>
</head>
<body>

<div id="joystick">
  <div class="key" id="up">▲</div>
  <div class="key" id="left">◀</div>
  <div id="center"></div>
  <div class="key" id="right">▶</div>
  <div class="key" id="down">▼</div>
</div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfd8e8);

const camera = new THREE.PerspectiveCamera(
  75, window.innerWidth / window.innerHeight, 0.1, 100
);
camera.position.set(0, 2, 8);
camera.lookAt(0, 1.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 2));

const light = new THREE.PointLight(0xfff2c4, 40, 30);
light.position.set(0, 4, 2);
scene.add(light);

function box(w, h, d, color, x, y, z) {
  const obj = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color })
  );
  obj.position.set(x, y, z);
  scene.add(obj);
  return obj;
}

// Bright lobby floor and carpet
box(12, 0.2, 12, 0xd8c3a5, 0, -0.1, 0);
box(6, 0.04, 7, 0x8b3f3f, 0, 0.03, 1);

// Lobby walls
box(12, 4, 0.2, 0xf0e6d2, 0, 2, -6);
box(0.2, 4, 12, 0xe7dcc8, -6, 2, 0);
box(0.2, 4, 12, 0xe7dcc8, 6, 2, 0);

// Reception desk and top
box(4, 1.2, 1.2, 0x6b4226, 0, 0.6, -3);
box(4.2, 0.15, 1.4, 0x9b6b43, 0, 1.25, -3);

// Gold reception bell
const bell = new THREE.Mesh(
  new THREE.SphereGeometry(0.16, 16, 16),
  new THREE.MeshStandardMaterial({
    color: 0xffd700, metalness: 0.6, roughness: 0.25
  })
);
bell.position.set(0, 1.48, -3);
scene.add(bell);

// Two doors
box(1.5, 2.8, 0.2, 0x6b4226, -3.5, 1.4, -5.85);
box(1.5, 2.8, 0.2, 0x6b4226, 3.5, 1.4, -5.85);

// Hotel signboard
box(5, 0.8, 0.15, 0x8b6f47, 0, 3.1, -5.8);

// Ceiling light
const ceilingLight = new THREE.Mesh(
  new THREE.SphereGeometry(0.3, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xffffcc })
);
ceilingLight.position.set(0, 3.8, 1);
scene.add(ceilingLight);

// Circular control: hold a direction to move
const directions = {
  up: false, down: false, left: false, right: false
};

for (const name of Object.keys(directions)) {
  const button = document.getElementById(name);

  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    directions[name] = true;
    button.classList.add("active");
    button.setPointerCapture(event.pointerId);
  });

  function stop() {
    directions[name] = false;
    button.classList.remove("active");
  }

  button.addEventListener("pointerup", stop);
  button.addEventListener("pointercancel", stop);
  button.addEventListener("lostpointercapture", stop);
}

// Move sideways without rotating the camera
function animate() {
  requestAnimationFrame(animate);

  const speed = 0.07;
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0;
  forward.normalize();

  const sideways = new THREE.Vector3(
    -forward.z, 0, forward.x
  );

  if (directions.up) camera.position.addScaledVector(forward, speed);
  if (directions.down) camera.position.addScaledVector(forward, -speed);
  if (directions.left) camera.position.addScaledVector(sideways, -speed);
  if (directions.right) camera.position.addScaledVector(sideways, speed);

  // Keep the player inside the lobby for now
  camera.position.x = THREE.MathUtils.clamp(camera.position.x, -5.2, 5.2);
  camera.position.z = THREE.MathUtils.clamp(camera.position.z, -5.2, 5.2);

  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
