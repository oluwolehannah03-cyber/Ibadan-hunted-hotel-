<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ibadan Haunted Hotel</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>

<body>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151515);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0, 2, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);


// LIGHT
const light = new THREE.PointLight(0xffe0a0, 30, 20);
light.position.set(0, 4, 2);
scene.add(light);

const ambient = new THREE.AmbientLight(0xffffff, 0.35);
scene.add(ambient);


// FLOOR
const floor = new THREE.Mesh(
  new THREE.BoxGeometry(12, 0.2, 12),
  new THREE.MeshStandardMaterial({ color: 0x555555 })
);

floor.position.y = -0.1;
scene.add(floor);


// BACK WALL
const backWall = new THREE.Mesh(
  new THREE.BoxGeometry(12, 4, 0.2),
  new THREE.MeshStandardMaterial({ color: 0x777777 })
);

backWall.position.set(0, 2, -6);
scene.add(backWall);


// LEFT WALL
const leftWall = new THREE.Mesh(
  new THREE.BoxGeometry(0.2, 4, 12),
  new THREE.MeshStandardMaterial({ color: 0x666666 })
);

leftWall.position.set(-6, 2, 0);
scene.add(leftWall);


// RIGHT WALL
const rightWall = new THREE.Mesh(
  new THREE.BoxGeometry(0.2, 4, 12),
  new THREE.MeshStandardMaterial({ color: 0x666666 })
);

rightWall.position.set(6, 2, 0);
scene.add(rightWall);


// RECEPTION DESK
const desk = new THREE.Mesh(
  new THREE.BoxGeometry(4, 1.2, 1.2),
  new THREE.MeshStandardMaterial({ color: 0x4a2c20 })
);

desk.position.set(0, 0.6, -3);
scene.add(desk);


// RECEPTION TOP
const deskTop = new THREE.Mesh(
  new THREE.BoxGeometry(4.2, 0.15, 1.4),
  new THREE.MeshStandardMaterial({ color: 0x704832 })
);

deskTop.position.set(0, 1.25, -3);
scene.add(deskTop);


// DOOR 1
const door1 = new THREE.Mesh(
  new THREE.BoxGeometry(1.5, 2.8, 0.2),
  new THREE.MeshStandardMaterial({ color: 0x321c14 })
);

door1.position.set(-3.5, 1.4, -5.85);
scene.add(door1);


// DOOR 2
const door2 = new THREE.Mesh(
  new THREE.BoxGeometry(1.5, 2.8, 0.2),
  new THREE.MeshStandardMaterial({ color: 0x321c14 })
);

door2.position.set(3.5, 1.4, -5.85);
scene.add(door2);


// ANIMATION
function animate() {
  requestAnimationFrame(animate);

  renderer.render(scene, camera);
}

animate();


// PHONE SCREEN RESIZE
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
